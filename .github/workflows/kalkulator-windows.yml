name: Kalkulátor – Windows build

on:
  push:
    paths:
      - "kalkulator/**"
      - ".github/workflows/kalkulator-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: kalkulator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inštalácia závislostí
        run: python -m pip install -r requirements.txt pyinstaller pytest

      - name: Testy
        run: python -m pytest -q tests

      - name: Zostavenie Kalkulator.exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --name Kalkulator --add-data "priklady;priklady" main.py

      - name: Zostavenie inštalátora (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc instalator\kalkulator.iss

      - uses: actions/upload-artifact@v4
        with:
          name: Kalkulator-Windows
          path: |
            kalkulator/dist/Kalkulator.exe
            kalkulator/dist/Kalkulator_instalator.exe
